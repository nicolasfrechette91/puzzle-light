<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="A calm puzzle about routing coloured light with mirrors." />
    <title>Puzzle Light</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070d'/%3E%3Cpath d='M5 22h9l9-12' stroke='%23ffde5a' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23fff8ec'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="title">
          <span id="level-num" class="num"></span>
          <h1 id="level-name"></h1>
        </div>
        <nav class="controls" aria-label="Game controls">
          <button id="btn-prev" class="btn" type="button" aria-label="Previous level" title="Previous level ( [ )">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <button id="btn-next" class="btn" type="button" aria-label="Next level" title="Next level ( ] )">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
          </button>
          <span class="sep" aria-hidden="true"></span>
          <button id="btn-undo" class="btn" type="button" aria-label="Undo" title="Undo (Z)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
          </button>
          <button id="btn-redo" class="btn" type="button" aria-label="Redo" title="Redo (Y)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5" /><path d="M20 9H10a6 6 0 0 0 0 12h3" /></svg>
          </button>
          <button id="btn-reset" class="btn" type="button" aria-label="Reset level" title="Reset (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" /><path d="M3.5 4v5h5" /></svg>
          </button>
        </nav>
      </header>
      <div class="status" aria-live="polite">
        <p id="note"></p>
        <div id="solved" hidden>
          <span id="solved-text">Solved</span>
          <button id="btn-continue" class="pill" type="button">Next level</button>
        </div>
      </div>
      <main id="stage">
        <canvas id="canvas" aria-label="Puzzle board"></canvas>
      </main>
      <footer class="help">
        <span class="fine">Click to rotate · right-click to rotate back · drag pieces from the tray · Z / Y undo &amp; redo</span>
        <span class="coarse">Tap to rotate · hold to rotate back · drag pieces from the tray</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
