<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="A calm puzzle about routing coloured light with mirrors." />
    <title>Puzzle Light</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070d'/%3E%3Cpath d='M5 22h9l9-12' stroke='%23ffde5a' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23fff8ec'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <section id="play-view" class="view">
      <header class="hud">
        <div class="title">
          <span id="level-num" class="num"></span>
          <h1 id="level-name"></h1>
        </div>
        <nav class="controls" aria-label="Game controls">
          <button id="btn-levels" class="btn" type="button" aria-label="Levels" title="Levels (L)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5" /><rect x="14" y="4" width="6" height="6" rx="1.5" /><rect x="4" y="14" width="6" height="6" rx="1.5" /><rect x="14" y="14" width="6" height="6" rx="1.5" /></svg>
          </button>
          <button id="btn-sound" class="btn wide-only" type="button" aria-label="Sound" title="Sound (M)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h3l5-4v14l-5-4H5z" /><path class="waves" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11" /><path class="mute" d="M17 9l5 6M22 9l-5 6" /></svg>
          </button>
          <button id="btn-edit" class="btn" type="button" aria-label="Level editor" title="Level editor">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" /><path d="M13.5 6.5l4 4" /></svg>
          </button>
          <span class="sep" aria-hidden="true"></span>
          <button id="btn-prev" class="btn" type="button" aria-label="Previous level" title="Previous level ( [ )">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <button id="btn-next" class="btn" type="button" aria-label="Next level" title="Next level ( ] )">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
          </button>
          <span class="sep" aria-hidden="true"></span>
          <button id="btn-undo" class="btn" type="button" aria-label="Undo" title="Undo (Z)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
          </button>
          <button id="btn-redo" class="btn" type="button" aria-label="Redo" title="Redo (Y)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5" /><path d="M20 9H10a6 6 0 0 0 0 12h3" /></svg>
          </button>
          <button id="btn-hint" class="btn" type="button" aria-label="Hint" title="Hint (H)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6" /><path d="M10 21h4" /><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" /></svg>
          </button>
          <button id="btn-reset" class="btn" type="button" aria-label="Reset level" title="Reset (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" /><path d="M3.5 4v5h5" /></svg>
          </button>
        </nav>
      </header>
      <div class="status" aria-live="polite">
        <p id="note"></p>
        <button id="btn-skip" class="pill small" type="button" title="Skip to a new puzzle (N)" hidden>Skip</button>
        <div id="solved" hidden>
          <span id="solved-text">Solved</span>
          <button id="btn-continue" class="pill" type="button">Next level</button>
        </div>
      </div>
      <main id="stage">
        <canvas id="canvas" aria-label="Puzzle board"></canvas>
      </main>
      <div id="levels" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="levels-title">
        <div class="sheet">
          <header class="sheet-head">
            <h2 id="levels-title">Levels</h2>
            <div class="sheet-tools">
              <button id="levels-sound" class="chip-btn" type="button">Sound: on</button>
              <button id="levels-edit" class="chip-btn" type="button">Level editor</button>
              <button id="levels-close" class="btn" type="button" aria-label="Close" title="Close (Esc)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
              </button>
            </div>
          </header>
          <div id="levels-body" class="sheet-body"></div>
        </div>
      </div>
      <footer class="help">
        <span class="fine">Click to rotate · right-click to rotate back · drag pieces from the tray · arrows + Space to play by keyboard · Z / Y undo</span>
        <span class="coarse">Tap to rotate · hold to rotate back · drag pieces from the tray</span>
      </footer>
      </section>

      <section id="edit-view" class="view" hidden>
        <header class="hud">
          <div class="title">
            <span class="num">Editor</span>
            <input id="ed-name" class="name-input" maxlength="40" aria-label="Level name" />
          </div>
          <nav class="controls" aria-label="Editor controls">
            <button id="ed-exit" class="btn" type="button" aria-label="Back to the game" title="Back to the game">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7" /><path d="M6 10v10h12V10" /></svg>
            </button>
            <span class="sep" aria-hidden="true"></span>
            <button id="ed-undo" class="btn" type="button" aria-label="Undo" title="Undo (Z)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
            </button>
            <button id="ed-redo" class="btn" type="button" aria-label="Redo" title="Redo (Y)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5" /><path d="M20 9H10a6 6 0 0 0 0 12h3" /></svg>
            </button>
            <span class="sep" aria-hidden="true"></span>
            <button id="ed-test" class="btn" type="button" aria-label="Test play" title="Test play (T)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" /></svg>
            </button>
            <button id="ed-share" class="btn" type="button" aria-label="Copy share link" title="Copy share link">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1" /><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" /></svg>
            </button>
            <button id="ed-save" class="btn" type="button" aria-label="Save to my levels" title="Save to My levels (needs a verified solution)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z" /><path d="M8 4v5h7V4" /><path d="M8 20v-6h8v6" /></svg>
            </button>
          </nav>
        </header>
        <div class="status" aria-live="polite"><p id="ed-status"></p></div>
        <div class="editor-body">
          <main id="ed-stage" class="ed-stage">
            <canvas id="ed-canvas" aria-label="Level being edited"></canvas>
          </main>
          <aside class="panel" aria-label="Editor tools">
            <section>
              <h2>Pieces</h2>
              <div id="ed-tools" class="tools"></div>
              <div id="ed-colors" class="swatches" aria-label="Colour"></div>
              <div id="ed-links" class="swatches" aria-label="Portal pair"></div>
              <div id="ed-lock" class="segmented" role="group" aria-label="What the player may do">
                <button type="button" data-lock="fixed" title="Part of the puzzle">Fixed</button>
                <button type="button" data-lock="rotate" title="The player may turn it">Turns</button>
                <button type="button" data-lock="free" title="The player may move it">Moves</button>
              </div>
            </section>
            <section>
              <h2>Tray</h2>
              <div id="ed-tray" class="chips"></div>
              <button id="ed-tray-add" type="button" class="pill small">Add brush piece to tray</button>
            </section>
            <section>
              <h2>Level</h2>
              <div class="row wrap">
                <span class="label">Width</span>
                <button id="ed-w-dec" type="button" class="chip-btn" aria-label="Narrower">−</button>
                <span id="ed-wv" class="size"></span>
                <button id="ed-w-inc" type="button" class="chip-btn" aria-label="Wider">+</button>
                <span class="label">Height</span>
                <button id="ed-h-dec" type="button" class="chip-btn" aria-label="Shorter">−</button>
                <span id="ed-hv" class="size"></span>
                <button id="ed-h-inc" type="button" class="chip-btn" aria-label="Taller">+</button>
              </div>
              <label class="field">Note <input id="ed-note" maxlength="90" placeholder="Shown with the level" /></label>
              <div class="row">
                <label class="field inline">Par <input id="ed-par" type="number" min="0" max="20" inputmode="numeric" placeholder="none" /></label>
                <label class="check"><input id="ed-bends" type="checkbox" /> 90° bends only</label>
              </div>
            </section>
            <section>
              <h2>Solver</h2>
              <div id="ed-check" aria-live="polite"></div>
            </section>
            <section>
              <h2>My levels</h2>
              <div id="ed-mine"></div>
              <div class="row wrap">
                <button id="ed-new" type="button" class="chip-btn">New</button>
                <button id="ed-import" type="button" class="chip-btn">Import JSON</button>
                <button id="ed-export" type="button" class="chip-btn">Copy JSON</button>
              </div>
            </section>
          </aside>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
